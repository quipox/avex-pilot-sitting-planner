  mb:   {n:"Mass & Balance",       t:"calc",    w:"light"},
  perf: {n:"Performance",          t:"calc",    w:"heavy"},
  fp:   {n:"Flight Planning",      t:"calc",    w:"heavy"},
  hpl:  {n:"Human Performance",    t:"memory",  w:"light"},
  met:  {n:"Meteorology",          t:"concept", w:"heavy"},
  gnav: {n:"General Navigation",   t:"calc",    w:"heavy"},
  rnav: {n:"Radio Navigation",     t:"concept", w:"med"},
  ops:  {n:"Operational Procedures",t:"memory", w:"med"},
  law:  {n:"Air Law",              t:"memory",  w:"med"},
  com:  {n:"Communications",       t:"memory",  w:"light"},
};
const HOURS = {heavy:100, med:70, light:40}; // ~1,000 h split by workload
const OVERLAP_WEEKS = 4; // sitting 2's first subject is started before sitting 1 is booked
const PACE = {
  "full-easy": {days:5, target:6},
  "full-hard": {days:5, target:5},
  "job-easy":  {days:6, target:2},
  "job-hard":  {days:6, target:2},
};
const PLANS = {
  "full-easy": {name:"Plan A – Full time, three sittings",
    why:"The heavy foundation subjects come first, while the 18-month clock is not yet running. Light subjects and Flight Planning close the plan.",
    sits:[["pof","agk","gnav","ins"],["perf","rnav","met","law"],["ops","hpl","mb","com","fp"]]},
  "full-hard": {name:"Plan B – Full time, four sittings",
    why:"Heavy foundations first, and never more than one heavy calculation subject per sitting. Light subjects and Flight Planning close the plan. Start using your flight computer from the first week.",
    sits:[["pof","agk","ins"],["gnav","law","met"],["perf","rnav","hpl","ops"],["mb","com","fp"]]},
  "job-easy": {name:"Plan C – Around a job, calculation foundations first",
    why:"Principles of Flight, AGK and General Navigation in the first sitting, while the clock is not running. Light subjects and Flight Planning close the plan.",
    sits:[["pof","agk","gnav"],["ins","rnav","perf"],["met","law","ops","hpl"],["mb","com","fp"]]},
  "job-hard": {name:"Plan D – Around a job, calculation subjects spread out",
    why:"Concept foundations first. General Navigation, Performance and Flight Planning each go in a different sitting, so you never face two heavy calculation subjects together.",
    sits:[["pof","agk","hpl"],["gnav","ins","law"],["perf","rnav","met"],["ops","mb","com","fp"]]},
};
// One of our authors' sittings, shown as an example in the editor (it does not pass every check).
const EXAMPLES = {
  author553: {name:"One author's 5 + 5 + 3",
    sits:[["agk","ins","rnav","gnav","hpl"],["pof","perf","ops","law","com"],["fp","met","mb"]]},
};
// Subject table: full name, questions, exam minutes, main type, guide link (AMC1 ARA.FCL.300(b))
const INFO = {
  law: ["Air Law",44,60,"Memory",""],
  agk: ["Airframe, Systems, Electrics, Power Plant",80,120,"Concept + memory","https://www.aviationexam.com/en/l/atpl-aircraft-general-knowledge"],
  ins: ["Instrumentation",60,90,"Concept","https://www.aviationexam.com/en/l/atpl-instrumentation"],
  mb:  ["Mass and Balance",25,75,"Calculation",""],
  perf:["Performance",45,120,"Calculation + concept","https://www.aviationexam.com/en/l/atpl-performance-airplane"],
  fp:  ["Flight Planning and Monitoring",42,120,"Calculation","https://www.aviationexam.com/en/l/atpl-flight-planning-and-monitoring/"],
  hpl: ["Human Performance and Limitations",48,90,"Memory + concept",""],
  met: ["Meteorology",84,120,"Concept + memory",""],
  gnav:["General Navigation",55,135,"Calculation + concept","https://www.aviationexam.com/en/l/atpl-general-navigation"],
  rnav:["Radio Navigation",66,90,"Concept + calculation",""],
  ops: ["Operational Procedures",42,75,"Memory","https://www.aviationexam.com/en/l/atpl-operational-procedures"],
  pof: ["Principles of Flight",46,90,"Concept","https://www.aviationexam.com/en/l/atpl-principles-of-flight-airplane"],
  com: ["Communications",34,60,"Memory",""],
};
// "X builds on Y": Y should be in the same sitting as X or earlier
const BUILDS_ON = {perf:["pof","agk"], ins:["agk"], rnav:["gnav"], ops:["law","met","hpl"], com:["law"], fp:["perf","mb","gnav","rnav","met","ops"]};
const HEAVY_CALC = ["gnav","perf","fp"];
const STRONG_FACTOR = 0.7, STRONG_MAX = 3, MAX_SITTINGS = 6;
const CODES = {law:"010",agk:"021",ins:"022",mb:"031",perf:"032",fp:"033",hpl:"040",met:"050",gnav:"061",rnav:"062",ops:"070",pof:"081",com:"090"};
const STATUS = ["Preparing","Ready","Completed"];
const STORE_KEY = "avex-atpl-planner-v1";
const nextMonth = (()=>{ const d=new Date(); const m=new Date(d.getFullYear(), d.getMonth()+1, 1); return `${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,"0")}`; })();
const state = {time:"full", maths:"easy", hours:6, days:5, start:nextMonth, strong:[], custom:null, status:[], picked:null};
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const monthIdx = d => d.getFullYear()*12 + d.getMonth();
const label = idx => `${MON[idx%12]} ${Math.floor(idx/12)}`;
const subjHours = k => Math.round(HOURS[S[k].w] * (state.strong.includes(k) ? STRONG_FACTOR : 1));
const planKey = () => state.time+"-"+state.maths;
const planLetter = () => PLANS[planKey()].name.split(" –")[0];
const currentSits = () => state.custom || PLANS[planKey()].sits;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---------- saving (per browser, optional) ---------- */
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({time:state.time,maths:state.maths,hours:state.hours,days:state.days,start:state.start,strong:state.strong,custom:state.custom,status:state.status})); }catch(e){}
}
function load(){
  let d; try{ d = JSON.parse(localStorage.getItem(STORE_KEY)||"null"); }catch(e){ return; }
  if(!d || typeof d!=="object") return;
  if(["full","job"].includes(d.time)) state.time=d.time;
  if(["easy","hard"].includes(d.maths)) state.maths=d.maths;
  if(d.hours>=1 && d.hours<=8) state.hours=Number(d.hours);
  if(d.days>=3 && d.days<=7) state.days=Number(d.days);
  if(/^\d{4}-\d{2}$/.test(d.start||"")) state.start=d.start;
  if(Array.isArray(d.strong)) state.strong=d.strong.filter(k=>k in S).slice(0,STRONG_MAX);
  if(Array.isArray(d.custom) && d.custom.length>=1 && d.custom.length<=MAX_SITTINGS){
    const flat=d.custom.flat();
    if(flat.length===13 && new Set(flat).size===13 && flat.every(k=>k in S)) state.custom=d.custom.map(s=>s.slice());
  }
  if(Array.isArray(d.status)) state.status=d.status.map(v=>[0,1,2].includes(v)?v:0);
}

/* ---------- study-order checks ---------- */
function runChecks(sits){
  const out=[], at={}, used=sits.map((s,i)=>s.length?i:-1).filter(i=>i>=0);
  sits.forEach((s,i)=>s.forEach(k=>at[k]=i));
  const first=used[0], last=used[used.length-1];
  for(const [x,ys] of Object.entries(BUILDS_ON)) ys.forEach(y=>{
    if(at[y]>at[x]) out.push(["warn",`${S[x].n} (sitting ${at[x]+1}) comes before ${S[y].n} (sitting ${at[y]+1}), which it builds on.`]);
  });
  const missingFirst=["pof","agk"].filter(k=>at[k]!==first);
  if(missingFirst.length) out.push(["warn",`${missingFirst.map(k=>S[k].n).join(" and ")} ${missingFirst.length>1?"are":"is"} not in your first sitting. Preparing the heaviest foundations before the clock starts saves exam time.`]);
  if(at.fp!==last) out.push(["warn","Flight Planning is not in your last sitting. It draws on almost every other subject."]);
  if(!sits[last].some(k=>S[k].w==="light")) out.push(["warn","Your last sitting has no light subject. After months of study, a lighter finish helps."]);
  sits.forEach((s,i)=>{ const c=s.filter(k=>HEAVY_CALC.includes(k)); if(c.length>1) out.push(["info",`Sitting ${i+1} has ${c.map(k=>S[k].n).join(" and ")} together, which is a lot of calculation at once.`]); });
  sits.forEach((s,i)=>{ if(s.length>5) out.push(["info",`Sitting ${i+1} has ${s.length} subjects. More than five in one sitting is demanding.`]); });
  if(used.length>4) out.push(["info",`You use ${used.length} of 6 sittings, which leaves ${6-used.length} for retakes.`]);
  return out;
}

/* ---------- controls ---------- */
function renderControls(){
  ROOT.querySelectorAll(".opts[data-key]").forEach(g=>g.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed", String(state[g.dataset.key]===o.dataset.val))));
  $("hours").value = state.hours; $("days").value = state.days;
  $("hoursOut").textContent = `${state.hours} h`; $("daysOut").textContent = `${state.days} days`;
  $("hoursHint").textContent = `${(state.hours*state.days).toFixed(1).replace(".0","")} hours a week. ` + (state.time==="full"
    ? "Typical full-time pace: 5–6 h a day, 5 days a week. Classes count towards these hours."
    : "Typical pace around a job: 2 h a day, 6 days a week (weekday evenings plus one weekend day).");
  $("start").value = state.start;
  $("strongOpts").innerHTML = Object.keys(CODES).sort((a,b)=>CODES[a].localeCompare(CODES[b])).map(k=>{
    const on = state.strong.includes(k), full = state.strong.length>=STRONG_MAX && !on;
    return `<button class="opt" data-k="${k}" aria-pressed="${on}" ${full?"disabled":""}>${CODES[k]} ${esc(S[k].n)}</button>`;
  }).join("");
}

/* ---------- plan ---------- */
function timing(sits){
  const days = state.days, hpd = state.hours;
  const load = sits.map(s=>{ const h=s.reduce((a,k)=>a+subjHours(k),0); const weeks=s.length?Math.ceil(h/(hpd*days)):0; return {h,weeks,perDay:weeks?h/(weeks*days):0}; });
  // exam week of each sitting: sitting 1 waits OVERLAP_WEEKS while sitting 2's first subject starts;
  // a short sitting is never booked earlier than two weeks after the previous one
  let cum=0, prev=null;
  const realWk = load.map(l=>{
    if(!l.weeks) return null;
    cum += l.weeks;
    const w = prev===null ? cum+OVERLAP_WEEKS : Math.max(cum, prev+2);
    prev = w; return w;
  });
  const [sy, sm] = state.start.split("-").map(Number);
  const startDate = new Date(sy, sm-1, 1), startIdx = monthIdx(startDate);
  const examIdx = realWk.map(w=>w===null?null:monthIdx(new Date(startDate.getTime()+w*7*864e5)));
  const valid = realWk.filter(w=>w!==null), validIdx = examIdx.filter(x=>x!==null);
  const first=valid[0], last=valid.at(-1), firstIdx=validIdx[0], lastIdx=validIdx.at(-1);
  return {load, realWk, examIdx, startIdx, first, last, firstIdx, lastIdx,
    clockUsed:lastIdx-firstIdx, prepMo:firstIdx-startIdx, deadlineIdx:firstIdx+18,
    totalH:load.reduce((a,l)=>a+l.h,0), used:valid.length};
}

function render(){
  const plan = PLANS[planKey()], sits = currentSits(), custom = !!state.custom;
  while(state.status.length<sits.length) state.status.push(0);
  state.status.length = sits.length;
  const T = timing(sits);
  const status = T.clockUsed > 18 ? "over" : T.clockUsed > 15 ? "tight" : "ok";
  const statusMsg = {
    over:`This plan needs ${T.clockUsed} months on the exam clock, more than the 18 allowed. Study more hours a day, or do more of the work before your first sitting.`,
    tight:`This plan uses ${T.clockUsed} of 18 months, which leaves little room for a retake. Consider more hours a day, or more preparation before your first sitting.`,
    ok:""}[status];
  const checks = runChecks(sits);
  const span = Math.max(T.last, T.first + 18*4.345), pct = w => (w/span*100).toFixed(2)+"%";
  const lastUsed = sits.map((s,i)=>s.length?i:-1).filter(i=>i>=0).at(-1);
  const picked = state.picked;
  const pickedAt = picked ? sits.findIndex(s=>s.includes(picked)) : -1;
  const courseNote = "In an integrated course your school sets the exam dates, so use the plan to decide what to prioritise inside each block. In a modular course you choose the dates: book each sitting only when your timed tests sit above 90%.";
  const clockNote = " The 18-month clock starts at your first exam, not your first class. Months spent preparing before sitting 1 are free, so use them: book sitting 1 only when its subjects pass timed tests above 90% and you have already started the first subject of sitting 2.";
  const retakeNote = " If you fail a subject, re-sit it in your next planned sitting and move one planned subject to the end.";
  $("result").innerHTML = `
    <div class="result-head"><p class="name">${custom?"Your own plan":esc(plan.name)}</p><span class="meta">${T.used} sittings · ${T.totalH.toLocaleString("en")} h · ${label(T.startIdx)} to ${label(T.lastIdx)}</span></div>
    <p class="why">${custom?"You have changed the recommended plan. The checks below tell you if anything needs a second look.":esc(plan.why)}</p>
    ${custom?`<p class="recbar">Recommended for your answers: <b>${esc(plan.name)}</b> <button class="tbtn" data-act="reset">Go back to ${planLetter()}</button></p>`:""}
    <div class="toolbar">
      <button class="tbtn" data-act="add" ${sits.length>=MAX_SITTINGS?"disabled":""}>+ Add sitting</button>
      <button class="tbtn" data-act="example">Load an author's 5 + 5 + 3</button>
      <p class="help">Drag a subject to another sitting, or tap it and then tap <b>Move here</b>. Up to ${MAX_SITTINGS} sittings.</p>
    </div>
    ${statusMsg?`<p class="alert ${status}" role="status">${statusMsg}</p>`:""}
    <div class="pace">
      <div class="pace-big"><b>${state.hours} h</b><span>a day, ${state.days} days a week, ${(state.hours*state.days).toFixed(1).replace(".0","")} h a week</span></div>
      <div class="pace-big"><b>${label(T.firstIdx)}</b><span>first exam, after ${T.prepMo} months of preparation outside the clock</span></div>
      <div class="pace-big ${status}"><b>${T.clockUsed} of 18</b><span>months of the exam clock used. Deadline: end of ${label(T.deadlineIdx)}</span></div>
    </div>
    <div class="sittings">${sits.map((s,i)=>`
      <div class="sit${state.status[i]===2?" done":""}" data-sit="${i}">
        <h4>Sitting ${i+1}<span>${T.examIdx[i]===null?"–":label(T.examIdx[i])}</span></h4>
        ${s.length?`<p class="sit-load">${T.load[i].h} h · ${T.load[i].weeks} weeks · ${T.load[i].perDay.toFixed(1)} h/day</p>`:""}
        ${s.length?`<div class="seg" role="group" aria-label="Sitting ${i+1} progress">${STATUS.map((n,v)=>`<button class="v${v}" data-act="status" data-i="${i}" data-v="${v}" aria-pressed="${state.status[i]===v}">${n}</button>`).join("")}</div>`:""}
        ${i===lastUsed?`<div class="chip ksa">Pass KSA100 first<small>at your ATO</small></div>`:""}
        ${s.map(k=>`<button class="chip ${S[k].t}${state.strong.includes(k)?" strong":""}" draggable="true" data-k="${k}" aria-pressed="${picked===k}" title="Drag to another sitting, or tap and choose Move here">${state.status[i]===2?"✓ ":""}${esc(S[k].n)}<small>${subjHours(k)} h</small></button>`).join("")}
        ${picked && pickedAt!==i?`<button class="dropzone" data-act="drop" data-i="${i}">Move here</button>`:""}
        ${!s.length && !(picked && pickedAt!==i)?`<div class="dropzone">Drop subjects here</div>`:""}
        ${!s.length?`<button class="rm" data-act="remove" data-i="${i}">Remove sitting</button>`:""}
      </div>`).join("")}
    </div>
    <div class="checks" aria-live="polite">
      <h4>Study-order checks</h4>
      <ul>${checks.length?checks.map(([c,t])=>`<li class="${c}"><i aria-hidden="true">${c==="warn"?"!":"i"}</i><span>${esc(t)}</span></li>`).join(""):`<li class="ok"><i aria-hidden="true">✓</i><span>Every subject comes after the ones it builds on, the heavy foundations are first, and Flight Planning closes the plan with a light subject.</span></li>`}</ul>
    </div>
    <div class="tl" role="img" aria-label="Timeline: ${T.prepMo} months of free preparation, then ${T.clockUsed} of 18 months on the exam clock">
      <div class="tl-bar">
        <div class="tl-prep" style="left:0;width:${pct(T.first)}"></div>
        <div class="tl-window" style="left:${pct(T.first)};width:${pct(18*4.345)}"></div>
        <div class="tl-used" style="left:${pct(T.first)};width:${pct(T.last-T.first)}"></div>
        ${T.realWk.map((w,i)=>w===null?"":`<div class="tl-exam" style="left:${pct(w)}"><span>S${i+1}</span></div>`).join("")}
      </div>
      <div class="tl-key">
        <span><i class="k-prep"></i>Preparation before sitting 1: no clock, take your time</span>
        <span><i class="k-used"></i>Exam clock in use</span>
        <span><i class="k-window"></i>Rest of the 18-month window</span>
      </div>
    </div>
    <div class="legend"><span><i style="background:var(--concept)"></i>Concept: understand the mechanism</span><span><i style="background:var(--calc)"></i>Calculation: practise with a timer</span><span><i style="background:var(--memory)"></i>Memory: short daily repetition</span></div>
    <p class="note">${courseNote}${clockNote}${retakeNote}</p>
    <p class="hours-note">Hours assume about 1,000 h in total: the EASA minimum of 650 h (modular) or 750 h (integrated) of theory instruction plus question-bank practice, split as 100 h per heavy subject, 70 h per medium and 40 h per light, and 30% less for subjects you already know well. KSA100 is assessed by your ATO and is not counted here. Dates are estimates; your authority publishes the actual exam calendar.</p>`;
  renderHeroCard(T, status, custom);
  save();
}

function renderHeroCard(T, status, custom){
  const el = $("heroCard"); if(!el) return;
  const used = Math.min(T.clockUsed,18), C = 2*Math.PI*36;
  const tag = status==="ok"?["ok","ON TRACK"]:status==="tight"?["warn","TIGHT"]:["","OVER LIMIT"];
  const foot = status==="ok"?["","✓ Fits the 18-month window"]:status==="tight"?["warn","! Little room for a retake"]:["over","! Over the 18-month limit"];
  el.innerHTML = `
    <div class="hcard-top"><b>EXAM <span>CLOCK</span></b><span class="tag ${tag[0]}">${tag[1]}</span></div>
    <div class="hcard-mid">
      <div class="ring"><svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="36" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="6"/><circle cx="42" cy="42" r="36" fill="none" stroke="${status==="ok"?"#3C8CE9":status==="tight"?"#FF7202":"#FF0000"}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(used/18*C).toFixed(1)} ${C.toFixed(1)}"/></svg><div><b>${T.clockUsed}</b><span>of 18 mo</span></div></div>
      <div class="hrows">
        <div><span>${custom?"Your own plan":planLetter()}</span><b>${T.used} sittings</b></div>
        <div><span>First exam</span><b>${label(T.firstIdx)}</b></div>
        <div><span>Study pace</span><b>${state.hours} h × ${state.days} d</b></div>
      </div>
    </div>
    <div class="hcard-foot ${foot[0]}">${foot[1]}</div>`;
}

/* ---------- editing ---------- */
function editable(){ if(!state.custom) state.custom = PLANS[planKey()].sits.map(s=>s.slice()); return state.custom; }
function moveTo(k, to){
  const sits = editable(); const from = sits.findIndex(s=>s.includes(k));
  if(from<0 || from===to || !sits[to]) return;
  sits[from] = sits[from].filter(x=>x!==k); sits[to].push(k);
  state.picked = null; render();
}
$("result").addEventListener("click", e=>{
  const chip = e.target.closest(".chip[data-k]");
  if(chip){ state.picked = state.picked===chip.dataset.k ? null : chip.dataset.k; render(); return; }
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const act=b.dataset.act, i=Number(b.dataset.i);
  if(act==="drop" && state.picked) return moveTo(state.picked, i);
  if(act==="status"){ state.status[i]=Number(b.dataset.v); render(); return; }
  if(act==="add"){ const s=editable(); if(s.length<MAX_SITTINGS){ s.push([]); state.status.push(0); } render(); return; }
  if(act==="remove"){ const s=editable(); if(!s[i].length && s.length>1){ s.splice(i,1); state.status.splice(i,1); } state.picked=null; render(); return; }
  if(act==="example"){ state.custom = EXAMPLES.author553.sits.map(s=>s.slice()); state.status=[]; state.picked=null; render(); return; }
  if(act==="reset"){ state.custom=null; state.status=[]; state.picked=null; render(); return; }
});
let dragK = null;
$("result").addEventListener("dragstart", e=>{
  const chip = e.target.closest(".chip[data-k]"); if(!chip) return;
  dragK = chip.dataset.k; chip.classList.add("dragging");
  try{ e.dataTransfer.setData("text/plain", dragK); e.dataTransfer.effectAllowed="move"; }catch(x){}
});
$("result").addEventListener("dragend", ()=>{ dragK=null; ROOT.querySelectorAll(".sit.over,.chip.dragging").forEach(x=>x.classList.remove("over","dragging")); });
$("result").addEventListener("dragover", e=>{
  const sit = e.target.closest(".sit[data-sit]"); if(!sit || !dragK) return;
  e.preventDefault(); ROOT.querySelectorAll(".sit.over").forEach(x=>x!==sit&&x.classList.remove("over")); sit.classList.add("over");
});
$("result").addEventListener("drop", e=>{
  const sit = e.target.closest(".sit[data-sit]"); if(!sit || !dragK) return;
  e.preventDefault(); const k=dragK; dragK=null; moveTo(k, Number(sit.dataset.sit));
});
ROOT.addEventListener("keydown", e=>{ if(e.key==="Escape" && state.picked){ state.picked=null; render(); } });

/* ---------- questions ---------- */
ROOT.querySelectorAll(".opts[data-key]").forEach(g=>{
  g.addEventListener("click",e=>{
    const b=e.target.closest(".opt"); if(!b) return;
    state[g.dataset.key]=b.dataset.val;
    if(g.dataset.key==="time"){ const p=PACE[planKey()]; state.hours=p.target; state.days=p.days; }
    renderControls(); render();
  });
});
["hours","days"].forEach(id=>$(id).addEventListener("input",e=>{ state[id]=Number(e.target.value); renderControls(); render(); }));
$("strongOpts").addEventListener("click",e=>{
  const b=e.target.closest(".opt"); if(!b||b.disabled) return;
  const k=b.dataset.k;
  state.strong = state.strong.includes(k) ? state.strong.filter(x=>x!==k) : [...state.strong, k].slice(0,STRONG_MAX);
  renderControls(); render();
});
$("start").addEventListener("change",()=>{ const v=$("start").value; if(/^\d{4}-\d{2}$/.test(v)){ state.start=v; render(); } });
load(); renderControls(); render();


})();
</script>
