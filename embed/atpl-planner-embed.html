<!--
  AVIATIONEXAM · ATPL STUDY PLANNER (embeddable block)
  Paste this whole block, unchanged, where [INTERACTIVE PLANNER] appears in the article.
  - Self-contained: no external files, fonts or libraries. It uses the page's own font.
  - Isolated with Shadow DOM: the blog's CSS cannot change it and its CSS cannot change the blog.
  - Needs the CMS to keep the inline <script>. If the editor strips scripts, leave the block out:
    the article text already includes the four plans as static content.
-->
<div id="avex-atpl-planner"><noscript>The interactive planner needs JavaScript. The four study plans are listed in the article.</noscript></div>
<script>
(function(){
var HOST = document.getElementById("avex-atpl-planner");
if (!HOST || HOST.shadowRoot) return;
var ROOT = HOST.attachShadow({mode: "open"});
ROOT.innerHTML = "<style>" + ":host{display:block;background:#fff;color:var(--fg);font-family:inherit;line-height:1.5;color-scheme:light;max-width:960px;margin:32px auto;text-align:left}\np{margin-top:0}\nbutton,input{font-family:inherit}\n.wrap{display:grid;gap:28px}\n\n/* Layout: a flight-plan form. Two tappable questions, the plan drawn as sitting columns; charts below. Aviationexam brand palette: red BD2026, orange FF7202, green 00A650, blue 0073BF, grey 58595B. */\n:host{\n  --bg:#ffffff; --panel:#fafafa; --fg:#1a1a1a; --muted:#58595B; --line:#e2e3e5;\n  --accent:#BD2026; --accent-soft:#f9e6e7;\n  --alert:#FF0000;\n  --memory:#FF7202; --memory-soft:#fff0e3;\n  --calc:#00A650; --calc-soft:#e3f5ea;\n  --concept:#0073BF; --concept-soft:#e3f0fa;\n  --sans:inherit;\n  --mono:Helvetica,\"Helvetica Neue\",Arial,sans-serif;\n}\n/* Single light theme by brand choice: always white. */\n*{box-sizing:border-box}\n.wrap{max-width:960px;margin:0 auto;display:grid;gap:32px}\nheader h1{font-size:clamp(26px,4vw,38px);line-height:1.1;margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}\nheader p{margin:0;color:var(--muted);max-width:60ch}\n.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}\nh3{font-size:20px;margin:0 0 4px;text-wrap:balance}\n.sub{color:var(--muted);margin:0 0 16px;max-width:65ch}\n/* questions */\n.steps{display:grid;gap:14px}\n.q{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}\n.q .n{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:4px;min-width:28px}\n.q .t{font-weight:600;margin:0 0 8px}\n.opts{display:flex;flex-wrap:wrap;gap:8px}\n.opt{border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer}\n.opt:hover{border-color:var(--accent)}\n.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.opt[aria-pressed=\"true\"]{background:var(--accent);color:#fff;border-color:var(--accent)}\n/* result */\n.result{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 20px 22px}\n.result-head{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between;margin-bottom:6px}\n.result-head .name{font-size:20px;font-weight:700;margin:0}\n.result-head .meta{font-family:var(--mono);font-size:13px;color:var(--muted)}\n.why{color:var(--muted);margin:0 0 18px;max-width:70ch}\n.sittings{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}\n.sit{border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:8px}\n.sit h4{margin:0;font-size:13px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}\n.sit h4 span{color:var(--accent)}\n.chip{border-radius:7px;padding:7px 10px;font-size:14px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px;border-left:4px solid}\n.chip small{font-family:var(--mono);font-size:11px;opacity:.8}\n.chip.memory{background:var(--memory-soft);border-color:var(--memory)}\n.chip.calc{background:var(--calc-soft);border-color:var(--calc)}\n.chip.concept{background:var(--concept-soft);border-color:var(--concept)}\n.pace{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0 0 16px}\n.pace-big{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}\n.pace-big b{display:block;font-family:var(--mono);font-size:24px;line-height:1.15;color:var(--fg)}\n.pace-big span{font-size:13px;color:var(--muted)}\n.chip small{white-space:nowrap}\n.sit-load{margin:0;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}\n.tl{margin-top:18px}\n.tl-bar{position:relative;height:30px;margin:22px 0 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}\n.tl-bar>div{position:absolute;top:0;bottom:0}\n.tl-prep{background:var(--concept-soft);border-right:2px solid var(--concept)}\n.tl-window{background:var(--accent-soft)}\n.tl-used{background:var(--accent);opacity:.75}\n.tl-exam{width:2px;background:var(--fg);top:-6px!important;bottom:-6px!important}\n.tl-exam span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11px;font-weight:600;color:var(--fg)}\n.tl-key{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted)}\n.tl-key i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}\n.k-prep{background:var(--concept-soft);border:1px solid var(--concept)} .k-used{background:var(--accent);opacity:.75} .k-window{background:var(--accent-soft);border:1px solid var(--line)}\n.chip.ksa{background:transparent;border:1px dashed var(--accent);border-left:4px solid var(--accent);color:var(--accent);font-weight:600}\n.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}\n.rule{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);min-width:0}\n.rule b{display:block;font-family:var(--mono);font-size:22px;color:var(--accent);line-height:1.1}\n.rule span{font-size:13px;color:var(--muted)}\n.chip.retake{background:var(--accent-soft);border-color:var(--alert);border-style:dashed}\n.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 24px;max-width:620px}\n.slider{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:4px 12px;font-size:14px;color:var(--muted)}\n.slider output{font-family:var(--mono);font-weight:600;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}\n.slider input{grid-column:1/-1;width:100%;accent-color:var(--accent);height:28px;margin:0}\n.slider input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.disclaimer{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:8px;padding:14px 16px;background:var(--panel)}\n.disclaimer h3{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}\n.disclaimer p{margin:0;font-size:13px;color:var(--muted);max-width:80ch}\n.brand{display:inline-block;margin:0 0 22px}\n.brand img{display:block;height:auto;width:min(240px,60vw)}\n.hint{margin:8px 0 0;font-size:12.5px;color:var(--muted)}\n.opt-note{font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}\n.opts.subj .opt{font-size:13px;padding:6px 12px}\n.opt:disabled{opacity:.4;cursor:not-allowed}\n.month input{font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}\n.month input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\n.alert{margin:0 0 14px;padding:10px 14px;border-radius:8px;font-size:14px;font-weight:500}\n.alert.over{background:#ffe5e5;border-left:4px solid var(--alert);color:#7a0000}\n.alert.tight{background:var(--memory-soft);border-left:4px solid var(--memory);color:#7a3600}\n.pace-big.over b{color:var(--alert)} .pace-big.tight b{color:var(--memory)}\n.chip.strong{opacity:.75;border-left-style:dotted}\n.hours-note{margin:10px 0 0;font-size:12.5px;color:var(--muted);max-width:75ch}\n.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;font-size:13px;color:var(--muted)}\n.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}\n.note{margin:14px 0 0;padding:12px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:14px}\n/* decision tree svg + dependency map */\n.chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}\nsvg{display:block;width:100%;height:auto}\nsvg text{font-family:var(--mono)}\nsvg .m{font-family:var(--mono)}\n/* gantt */\n.gantt{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;align-items:center;font-size:13px}\n.gantt .lbl{font-weight:500;min-width:0}\n.gantt .track{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;height:26px}\n.gantt .track div{border-radius:3px}\n.gantt .axis{grid-column:2;display:grid;grid-template-columns:repeat(16,1fr);font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center}\n.p1{background:var(--concept)} .p2{background:var(--calc)} .p3{background:var(--line)} .p4{background:var(--accent)} .p5{background:var(--fg)}\n.glegend{display:flex;flex-wrap:wrap;gap:12px 18px;margin-top:12px;font-size:13px;color:var(--muted)}\n.glegend i{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:6px}\n@media (max-width:520px){ .q{grid-template-columns:1fr} .q .n{display:none} .gantt{grid-template-columns:110px 1fr} }\n@media (prefers-reduced-motion:no-preference){ .chip{transition:transform .15s} }\nfooter{color:var(--muted);font-size:13px;max-width:70ch}\n" + "</style>" + "<div class=\"wrap\">\n<header>\n  <p class=\"eyebrow\">Interactive planner</p>\n  <h3>Build your own ATPL study plan</h3>\n  <p class=\"sub\">Answer a few questions to get a sitting plan with dates, hours a day and the 18-month clock.</p>\n</header>\n<section>\n  <p class=\"eyebrow\">Step 1 of 2</p>\n  <h3>Who are you?</h3>\n  <p class=\"sub\">The plan below updates as you go.</p>\n  <div class=\"steps\">\n    <div class=\"q\"><div class=\"n\">Q1</div><div><p class=\"t\">How much time can you give it?</p><div class=\"opts\" data-key=\"time\">\n      <button class=\"opt\" data-val=\"full\" aria-pressed=\"true\">Full time</button>\n      <button class=\"opt\" data-val=\"job\" aria-pressed=\"false\">Around a job or other commitments</button></div></div></div>\n    <div class=\"q\"><div class=\"n\">Q2</div><div><p class=\"t\">How do you feel about calculations?</p><div class=\"opts\" data-key=\"maths\">\n      <button class=\"opt\" data-val=\"easy\" aria-pressed=\"true\">They come easily (engineering, science)</button>\n      <button class=\"opt\" data-val=\"hard\" aria-pressed=\"false\">Not my strong side</button></div></div></div>\n    <div class=\"q\"><div class=\"n\">Q3</div><div><p class=\"t\">How much can you study?</p>\n      <div class=\"sliders\">\n        <label class=\"slider\" for=\"hours\"><span>Hours a day</span><output id=\"hoursOut\" for=\"hours\">6 h</output>\n          <input type=\"range\" id=\"hours\" min=\"1\" max=\"8\" step=\"0.5\" value=\"6\"></label>\n        <label class=\"slider\" for=\"days\"><span>Days a week</span><output id=\"daysOut\" for=\"days\">5 days</output>\n          <input type=\"range\" id=\"days\" min=\"3\" max=\"7\" step=\"1\" value=\"5\"></label>\n      </div>\n      <p class=\"hint\" id=\"hoursHint\"></p></div></div>\n    <div class=\"q\"><div class=\"n\">Q4</div><div><p class=\"t\">When do you start studying?</p>\n      <label class=\"month\"><span class=\"sr\">Start month</span><input type=\"month\" id=\"start\"></label></div></div>\n    <div class=\"q\"><div class=\"n\">Q5</div><div><p class=\"t\">Any subjects you already know well? <span class=\"opt-note\">Optional, up to 3</span></p><div class=\"opts subj\" id=\"strongOpts\"></div><p class=\"hint\">Each one you pick gets 30% less study time.</p></div></div>\n  </div>\n</section>\n<section>\n  <p class=\"eyebrow\">Step 2 of 2</p>\n  <h3>Your plan</h3>\n  <div class=\"result\" id=\"result\"></div>\n</section>\n<aside class=\"disclaimer\" aria-labelledby=\"disc-h\">\n  <h3 id=\"disc-h\">Disclaimer</h3>\n  <p>Exam rules per EASA Part-FCL as published by Aviationexam. Workload and type labels are the Aviationexam author team's consensus, not an EASA classification. Whether a subject feels easy or hard is personal; move things around once you know yourself.</p>\n</aside>\n</div>";
function $(id){ return ROOT.getElementById(id); }

const S = {
  pof:  {n:"Principles of Flight", t:"concept", w:"heavy"},
  agk:  {n:"AGK Systems",          t:"concept", w:"heavy"},
  ins:  {n:"Instruments",          t:"concept", w:"med"},
  mb:   {n:"Mass & Balance",       t:"calc",    w:"light"},
  perf: {n:"Performance",          t:"calc",    w:"heavy"},
  fp:   {n:"Flight Planning",      t:"calc",    w:"heavy"},
  hpl:  {n:"Human Performance",    t:"memory",  w:"light"},
  met:  {n:"Meteorology",          t:"concept", w:"heavy"},
  gnav: {n:"General Navigation",   t:"calc",    w:"heavy"},
  rnav: {n:"Radio Navigation",     t:"concept", w:"med"},
  ops:  {n:"Operational Procedures",t:"memory", w:"med"},
  law:  {n:"Air Law",              t:"memory",  w:"med"},
  com:  {n:"Communications",       t:"memory",  w:"light"},
};
const HOURS = {heavy:100, med:70, light:40}; // ~1,000 h split by workload
const OVERLAP_WEEKS = 4; // sitting 2's first subject is started before sitting 1 is booked
const PACE = {
  "full-easy": {days:5, target:6},
  "full-hard": {days:5, target:5},
  "job-easy":  {days:6, target:2},
  "job-hard":  {days:6, target:2},
};
const PLANS = {
  "full-easy": {name:"Plan A – Full time, three sittings",
    why:"The heavy foundation subjects come first, while the 18-month clock is not yet running. Light subjects and Flight Planning close the plan.",
    sits:[["pof","agk","gnav","ins"],["perf","rnav","met","law"],["ops","hpl","mb","com","fp"]]},
  "full-hard": {name:"Plan B – Full time, four sittings",
    why:"Heavy foundations first, and never more than one heavy calculation subject per sitting. Light subjects and Flight Planning close the plan. Start using your flight computer from the first week.",
    sits:[["pof","agk","ins"],["gnav","law","met"],["perf","rnav","hpl","ops"],["mb","com","fp"]]},
  "job-easy": {name:"Plan C – Around a job, calculation foundations first",
    why:"Principles of Flight, AGK and General Navigation in the first sitting, while the clock is not running. Light subjects and Flight Planning close the plan.",
    sits:[["pof","agk","gnav"],["ins","rnav","perf"],["met","law","ops","hpl"],["mb","com","fp"]]},
  "job-hard": {name:"Plan D – Around a job, calculation subjects spread out",
    why:"Concept foundations first. General Navigation, Performance and Flight Planning each go in a different sitting, so you never face two heavy calculation subjects together.",
    sits:[["pof","agk","hpl"],["gnav","ins","law"],["perf","rnav","met"],["ops","mb","com","fp"]]},
};
const STRONG_FACTOR = 0.7, STRONG_MAX = 3;
const CODES = {law:"010",agk:"021",ins:"022",mb:"031",perf:"032",fp:"033",hpl:"040",met:"050",gnav:"061",rnav:"062",ops:"070",pof:"081",com:"090"};
const nextMonth = (()=>{ const d=new Date(); const m=new Date(d.getFullYear(), d.getMonth()+1, 1); return `${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,"0")}`; })();
const state = {time:"full", maths:"easy", hours:6, days:5, start:nextMonth, strong:[]};
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const monthIdx = d => d.getFullYear()*12 + d.getMonth();
const label = idx => `${MON[idx%12]} ${Math.floor(idx/12)}`;
const subjHours = k => Math.round(HOURS[S[k].w] * (state.strong.includes(k) ? STRONG_FACTOR : 1));

function renderControls(){
  $("hours").value = state.hours;
  $("days").value = state.days;
  $("hoursOut").textContent = `${state.hours} h`;
  $("daysOut").textContent = `${state.days} days`;
  $("hoursHint").textContent =
    `${(state.hours*state.days).toFixed(1).replace(".0","")} hours a week. ` + (state.time==="full"
    ? "Typical full-time pace: 5–6 h a day, 5 days a week. Classes count towards these hours."
    : "Typical pace around a job: 2 h a day, 6 days a week (weekday evenings plus one weekend day).");
  const so = $("strongOpts");
  so.innerHTML = Object.keys(CODES).sort((a,b)=>CODES[a].localeCompare(CODES[b])).map(k=>{
    const on = state.strong.includes(k), full = state.strong.length>=STRONG_MAX && !on;
    return `<button class="opt" data-k="${k}" aria-pressed="${on}" ${full?"disabled":""}>${CODES[k]} ${S[k].n}</button>`;
  }).join("");
}

function render(){
  const plan = PLANS[state.time+"-"+state.maths];
  const el = $("result");
  const sits = plan.sits.map(s=>s.slice());
  const courseNote = "In an integrated course your school sets the exam dates, so use the plan to decide what to prioritise inside each block. In a modular course you choose the dates: book each sitting only when your timed tests sit above 90%.";
  const clockNote = " The 18-month clock starts at your first exam, not your first class. Months spent preparing before sitting 1 are free, so use them: book sitting 1 only when its subjects pass timed tests above 90% and you have already started the first subject of sitting 2.";
  const retakeNote = " If you fail a subject, re-sit it in your next planned sitting and move one planned subject to the end.";
  const days = state.days, hpd = state.hours;
  const load = sits.map(s=>{
    const h = s.reduce((a,k)=>a+subjHours(k),0);
    const weeks = Math.ceil(h/(hpd*days));
    return {h, weeks, perDay: h/(weeks*days)};
  });
  // exam week of each sitting: sitting 1 waits OVERLAP_WEEKS while sitting 2's first subject starts
  let cum = 0;
  const examWk = load.map((l,i)=>{ cum += l.weeks; return i===0 ? cum + OVERLAP_WEEKS : cum; });
  const [sy, sm] = state.start.split("-").map(Number);
  const startDate = new Date(sy, sm-1, 1);
  const examIdx = examWk.map(w=>monthIdx(new Date(startDate.getTime() + w*7*864e5)));
  const startIdx = monthIdx(startDate);
  const firstIdx = examIdx[0], lastIdx = examIdx[examIdx.length-1];
  const deadlineIdx = firstIdx + 18;           // end of this calendar month
  const clockUsed = lastIdx - firstIdx, prepMo = firstIdx - startIdx, totalMo = lastIdx - startIdx;
  const first = examWk[0], last = examWk[examWk.length-1];
  const totalH = load.reduce((a,l)=>a+l.h,0);
  const span = Math.max(last, first + 18*4.345);
  const pct = w => (w/span*100).toFixed(2)+"%";
  const dayLabel = `${days} days a week, ${(hpd*days).toFixed(1).replace(".0","")} h a week`;
  const status = clockUsed > 18 ? "over" : clockUsed > 15 ? "tight" : "ok";
  const statusMsg = {
    over:`This plan needs ${clockUsed} months on the exam clock, more than the 18 allowed. Study more hours a day, or do more of the work before your first sitting.`,
    tight:`This plan uses ${clockUsed} of 18 months, which leaves little room for a retake. Consider more hours a day, or more preparation before your first sitting.`,
    ok:""}[status];
  el.innerHTML = `
    <div class="result-head"><p class="name">${plan.name}</p><span class="meta">${sits.length} sittings · ${totalH} h · ${label(startIdx)} to ${label(lastIdx)}</span></div>
    <p class="why">${plan.why}</p>
    ${statusMsg?`<p class="alert ${status}" role="status">${statusMsg}</p>`:""}
    <div class="pace">
      <div class="pace-big"><b>${hpd} h</b><span>a day, ${dayLabel}</span></div>
      <div class="pace-big"><b>${label(firstIdx)}</b><span>first exam, after ${prepMo} months of preparation outside the clock</span></div>
      <div class="pace-big ${status}"><b>${clockUsed} of 18</b><span>months of the exam clock used. Deadline: end of ${label(deadlineIdx)}</span></div>
    </div>
    <div class="sittings">${sits.map((s,i)=>`
      <div class="sit"><h4>Sitting ${i+1}<span>${label(examIdx[i])}</span></h4>
        <p class="sit-load">${load[i].h} h · ${load[i].weeks} weeks · ${load[i].perDay.toFixed(1)} h/day</p>
        ${i===sits.length-1?`<div class="chip ksa">Pass KSA100 first<small>at your ATO</small></div>`:""}
        ${s.map(k=>`<div class="chip ${S[k].t}${state.strong.includes(k)?" strong":""}">${S[k].n}<small>${subjHours(k)} h</small></div>`).join("")}
      </div>`).join("")}
    </div>
    <div class="tl" role="img" aria-label="Timeline: ${Math.round(prepMo)} months of free preparation, then ${Math.round(clockUsed)} of 18 months on the exam clock">
      <div class="tl-bar">
        <div class="tl-prep" style="left:0;width:${pct(first)}"></div>
        <div class="tl-window" style="left:${pct(first)};width:${pct(18*4.345)}"></div>
        <div class="tl-used" style="left:${pct(first)};width:${pct(last-first)}"></div>
        ${examWk.map((w,i)=>`<div class="tl-exam" style="left:${pct(w)}"><span>S${i+1}</span></div>`).join("")}
      </div>
      <div class="tl-key">
        <span><i class="k-prep"></i>Preparation before sitting 1: no clock, take your time</span>
        <span><i class="k-used"></i>Exam clock in use</span>
        <span><i class="k-window"></i>Rest of the 18-month window</span>
      </div>
    </div>
    <div class="legend"><span><i style="background:var(--concept)"></i>Concept: understand the mechanism</span><span><i style="background:var(--calc)"></i>Calculation: practise with a timer</span><span><i style="background:var(--memory)"></i>Memory: short daily repetition</span></div>
    <p class="note">${courseNote}${clockNote}${retakeNote}</p>
    <p class="hours-note">Hours assume about 1,000 h in total: the EASA minimum of 650 h (modular) or 750 h (integrated) of theory instruction plus question-bank practice, split as 100 h per heavy subject, 70 h per medium and 40 h per light, and 30% less for subjects you already know well. KSA100 is assessed by your ATO and is not counted here. Dates are estimates; your authority publishes the actual exam calendar.</p>`;
}
ROOT.querySelectorAll(".opts[data-key]").forEach(g=>{
  g.addEventListener("click",e=>{
    const b=e.target.closest(".opt"); if(!b) return;
    g.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
    state[g.dataset.key]=b.dataset.val;
    if(g.dataset.key==="time"){ const p=PACE[state.time+"-"+state.maths]; state.hours=p.target; state.days=p.days; }
    renderControls(); render();
  });
});
["hours","days"].forEach(id=>$(id).addEventListener("input",e=>{
  state[id]=Number(e.target.value); renderControls(); render();
}));
$("strongOpts").addEventListener("click",e=>{
  const b=e.target.closest(".opt"); if(!b||b.disabled) return;
  const k=b.dataset.k;
  state.strong = state.strong.includes(k) ? state.strong.filter(x=>x!==k) : [...state.strong, k].slice(0,STRONG_MAX);
  renderControls(); render();
});
const startEl=$("start");
startEl.value=state.start;
startEl.addEventListener("change",()=>{ if(/^\d{4}-\d{2}$/.test(startEl.value)){ state.start=startEl.value; render(); } });
renderControls(); render();


})();
</script>
